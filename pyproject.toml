[project]
name = "tech-challenge-fase-2"
version = "0.1.0"
description = "Pipeline de Machine Learning para previsao de intencao de compra em e-commerce"
authors = [
    {name = "Alexandre Denardi",email = "denardi8442@gmail.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "mlflow (>=3.17.2,<4.0.0)",
    "dvc (>=3.67.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]
